# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

      # The VScode config files support comments, and some
      # bracketed/hyphenated keys which I think this task doesn't like
      - id: check-json
        exclude: .vscode/(settings|launch|tasks).json

      - id: detect-aws-credentials
        args:
          - --credentials-file
          - screeps.json
          - --allow-missing-credentials
      - id: check-added-large-files
      - id: no-commit-to-branch
        args:
          - --branch
          - main
          - --branch
          - devel
  - repo: local
    hooks:
      - id: installs
        name: Install Develop
        additional_dependencies:
          - package.json
        language: node
        entry: yarn
        pass_filenames: false
        verbose: true

      - id: builds
        name: Build project
        additional_dependencies:
          - package.json
        language: node
        entry: yarn build
        pass_filenames: false
        verbose: true

      - id: lints
        name: Lint project
        additional_dependencies:
          - package.json
        language: node
        entry: yarn lint
        pass_filenames: false
        verbose: true
