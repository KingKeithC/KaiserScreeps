name: Deploy

on:
  push:
    branches:
      - main
      - devel

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
      SCREEPS_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7 as of 2026-11-08
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # @v7 as of 2026-11-10
        with:
          node-version: "24"
          cache: "yarn"
      - run: yarn install --frozen-lockfile --immutable
      - run: yarn lint
      - run: yarn test
