name: Deploy

on:
  push:
    branches:
      - main
      - devel

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
      SCREEPS_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7 as of 2026-11-08
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # @v3 as of 2026-11-08
        with:
          version: 12
          runtime: node@24
          cache: true
      - run: pnpm exec rollup -c
